
plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp' version '2.3.6'
}

// We iterate fast on rgss-runtime SNAPSHOTs (republishing the same
// "1.1.0-SNAPSHOT" coordinate). Gradle's default 24h SNAPSHOT TTL means
// a freshly republished AAR won't be picked up until tomorrow unless you
// pass --refresh-dependencies. Drop the TTL to zero so every build does
// a quick HEAD against the registry and pulls the new artifact when it
// exists. One small request per changing dep per build — worth it for
// the SNAPSHOT churn during active runtime development.
configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

// One APK embeds one Ruby minor version (the variant), because Pokemon Studio
// game bytecode only loads on the Ruby minor that compiled it: 3.0 for games
// compiled by the Windows Studio, 3.2 for macOS, 3.3 for Linux.
// Select it with -PrubyVariant=3.2 (default 3.0).
def rubyVariants = ['3.0', '3.2', '3.3']
def rubyVariant = (project.findProperty('rubyVariant') ?: '3.0').toString()
if (!rubyVariants.contains(rubyVariant)) {
    throw new GradleException("Unsupported rubyVariant '${rubyVariant}', expected one of ${rubyVariants}")
}

// Debug APKs embed the Tracy profiler build of the runtime (<version>-tracy):
// LiteCGSS instrumented, listening on localhost only, recording nothing until
// a Tracy v0.13.1 server connects through adb forward (README, Profiling).
// Release APKs, and the games exported from them, never do. -Ptracy=false
// gives the debug APK the release runtime. litergss-everywhere publishes the
// Tracy runtime from 1.14.0 on: older versions have none to resolve.
def litergssVersion = libs.versions.litergss.get()
def tracyFirstLitergss = '1.14.0'
def versionAtLeast = { String version, String minimum ->
    def numbers = { String v -> v.tokenize('-')[0].tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 } }
    def a = numbers(version), b = numbers(minimum)
    for (i in 0..<Math.max(a.size(), b.size())) {
        def x = i < a.size() ? a[i] : 0
        def y = i < b.size() ? b[i] : 0
        if (x != y) return x > y
    }
    return true
}
def tracyWanted = (project.findProperty('tracy') ?: 'true').toString() != 'false'
def debugTracy = tracyWanted && versionAtLeast(litergssVersion, tracyFirstLitergss)

base {
    archivesName = "PSDK-android-ruby${rubyVariant}"
}

android {
    compileSdkVersion 35

    sourceSets {
        main {
            assets.srcDirs += ['src/main/ruby']
        }
    }

    packagingOptions.jniLibs.useLegacyPackaging true

    defaultConfig {
        applicationId "com.psdk.starter"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 28
        versionName "1.9.2"

        buildConfigField "String", "RUBY_VARIANT", "\"${rubyVariant}\""

        ndk {
            abiFilters += ["x86_64", "arm64-v8a"]
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                cFlags "-std=c11"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    // Releases ship with the project's own key: an update only installs over an
    // APK signed with the same one, and .epsa archives are encrypted for it
    // (exporter/lib/epsa_kdf.rb). CI decodes it from the repository's secrets
    // (RELEASE_KEYSTORE_*, see .github/workflows/build.yml). A build without
    // them signs its release APK with the debug key: on a CI runner, a new
    // random one every job.
    def releaseKeystore = System.getenv("RELEASE_KEYSTORE_FILE")
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType "pkcs12"
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'com.psdk'
}

kotlin {
    jvmToolchain(JavaVersion.VERSION_17.majorVersion.toInteger())
}

dependencies {
    testImplementation "junit:junit:4.13.2"

    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation(libs.bcprov.jdk15on)
    implementation(libs.appcompat)
    implementation(libs.material)
    implementation(libs.constraintlayout)
    implementation(libs.zip4j)
    implementation(libs.legacy)
    implementation libs.kotlin.stdlib

    implementation project(':screens')
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'

    // rgss-runtime is published once per Ruby variant: <version>-ruby<variant>,
    // and its Tracy build as <version>-ruby<variant>-tracy (debugTracy above).
    def rgssRuntime = "com.scorbutics.rubyvm:rgss-runtime-android:${litergssVersion}-ruby${rubyVariant}"
    releaseImplementation rgssRuntime
    debugImplementation debugTracy ? "${rgssRuntime}-tracy" : rgssRuntime
    implementation libs.litergss.host
}
