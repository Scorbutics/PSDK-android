[versions]
bcprov-jdk15on = "1.70"
appcompat = "1.5.1"
gradle = "9.4.1"
kotlin-stdlib = "1.8.20"
material = "1.7.0"
constraintlayout = "2.1.4"
legacy = "1.0.0"
zip4j = "2.11.5"
kotlinx-serialization = "1.7.0"
# Base version; app/build.gradle appends the -ruby<variant> suffix.
rgss-runtime-android = "1.2.6"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
material = { module = "com.google.android.material:material", version.ref = "material" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
legacy = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacy" }
bcprov-jdk15on = { module = "org.bouncycastle:bcprov-jdk15on", version.ref = "bcprov-jdk15on" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
