name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    # One APK per Ruby variant: game bytecode only loads on the Ruby minor
    # that compiled it (3.0 Windows Studio, 3.2 macOS, 3.3 Linux).
    strategy:
      fail-fast: false
      matrix:
        ruby_variant: ['3.0', '3.2', '3.3']
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release APKs are signed with the project's key (app/build.gradle).
      # A tag must have it: a release signed with a runner's random debug key
      # installs over no other release. Pull requests from forks get no
      # secrets: they build with the debug key.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is not set: the release would be signed with a random key"
              exit 1
            fi
            echo "No release key: the release APK is signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        # The screens module's tests don't depend on the Ruby variant: run
        # them once, with the 3.0 build
        run: ./gradlew assembleDebug assembleRelease ${{ matrix.ruby_variant == '3.0' && ':screens:testAndroidHostTest' || '' }} -PrubyVariant=${{ matrix.ruby_variant }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-ruby${{ matrix.ruby_variant }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ruby${{ matrix.ruby_variant }}
          path: app/build/outputs/apk/release/*.apk

  # The app's Ruby scripts and the exporter (exporter/), which builds its APKs
  # from the base APKs just built. On Ruby 3.0, the oldest one the
  # exporter runs on (Windows Pokemon Studio's); ubuntu-24.04 has no 3.0.
  test-ruby:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install gems
        run: gem install rubyzip minitest --no-document

      # Both: a release one has shortened resource paths (res/zu.png).
      - name: Download the base APKs
        uses: actions/download-artifact@v4
        with:
          pattern: app-*-ruby3.0
          path: base-apk

      - name: Run Ruby tests
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          export APKSIGNER="$build_tools/apksigner" ZIPALIGN="$build_tools/zipalign"
          for test in app/src/test/ruby/test_*.rb exporter/test/test_epsa_kdf.rb exporter/test/test_base_apk.rb exporter/test/test_save_transfer.rb; do
            echo "::group::$test"
            ruby "$test"
            echo "::endgroup::"
          done
          for base_apk in base-apk/*/*.apk; do
            echo "::group::exporter/test/test_export_android.rb on $base_apk"
            BASE_APK="$base_apk" ruby exporter/test/test_export_android.rb
            echo "::endgroup::"
          done

      - name: Run the native KDF parity test
        run: |
          cc -O2 -o test_epsa_kdf app/src/main/cpp/test_epsa_kdf.c app/src/main/cpp/sha256.c \
            app/src/main/cpp/hmac_sha256.c app/src/main/cpp/hkdf.c -I app/src/main/cpp
          ./test_epsa_kdf

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-ruby]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: app-*-ruby*
          path: artifacts

      # Every release APK carries the project's certificate, or the release
      # would not install over the previous one (and its .epsa archives would
      # not open on it)
      - name: Check the release signing certificate
        env:
          RELEASE_CERT_SHA256: a6d98164e6e385296f7cd688e5a7b4d833a50600ed04b7088958cb5efa54938a
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          status=0
          for apk in artifacts/app-release-*/*.apk; do
            cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "$apk: $cert"
            [ "$cert" = "$RELEASE_CERT_SHA256" ] || { echo "::error::$apk is not signed with the release key"; status=1; }
          done
          exit $status

      # The exporter that builds APKs from (and archives for) this release.
      - name: Package the exporter
        run: scripts/package_exporter.sh "$GITHUB_REF_NAME" artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*/*.apk
            artifacts/psdk-android-exporter-*.zip
