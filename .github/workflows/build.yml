name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    # One APK per Ruby variant: game bytecode only loads on the Ruby minor
    # that compiled it (3.0 Windows Studio, 3.2 macOS, 3.3 Linux).
    strategy:
      fail-fast: false
      matrix:
        ruby_variant: ['3.0', '3.2', '3.3']
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleDebug assembleRelease -PrubyVariant=${{ matrix.ruby_variant }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-ruby${{ matrix.ruby_variant }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ruby${{ matrix.ruby_variant }}
          path: app/build/outputs/apk/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: app-*-ruby*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/*.apk
