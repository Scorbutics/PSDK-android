// The app's Compose screens:
// - com.psdk.controls, the player's Controls: the on-screen gamepad's
//   settings, written to the player's layout file (litergss-everywhere's
//   TouchOverlay::LayoutFile);
// - com.psdk.logs, a developer's logs, never shown from the player's settings.
// Kotlin Multiplatform: the screens and their models are shared code; Android
// hosts them in activities. An iOS target joins once an iOS app hosts the
// module.
plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'com.android.kotlin.multiplatform.library'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
}

kotlin {
    jvmToolchain(17)

    androidLibrary {
        namespace = 'com.psdk.screens'
        compileSdk = 35
        minSdk = 26
        withHostTest {}
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation compose.runtime
                implementation compose.foundation
                implementation compose.material3
                implementation 'org.jetbrains.compose.material:material-icons-core:1.7.3'
                implementation libs.litergss.host
            }
        }
        commonTest {
            dependencies {
                implementation 'org.jetbrains.kotlin:kotlin-test'
            }
        }
        androidMain {
            dependencies {
                implementation 'androidx.activity:activity-compose:1.9.3'
            }
        }
    }
}
